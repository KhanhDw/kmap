[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kmap-backend"
version = "0.1.0"
description = "KMap backend — bản đồ 360° Tân Châu / Phú Tân / An Giang"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "pillow>=10.3",
    "piexif>=1.1",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
